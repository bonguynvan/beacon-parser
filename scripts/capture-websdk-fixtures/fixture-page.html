<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Web SDK fixture capture page</title>
  </head>
  <body>
    <h1>Web SDK fixture capture page</h1>
    <p>This page loads @adobe/alloy against a fake org/datastream and fires a
    handful of events so Playwright can intercept the resulting network
    requests. It is never deployed anywhere; it only runs locally under
    <code>pnpm capture</code>.</p>
    <script src="./alloy.js"></script>
    <script>
      window.alloy("configure", {
        edgeDomain: "fake-edge.example.com",
        datastreamId: "fake-datastream-id-0000",
        orgId: "FAKE0000000000000000000@AdobeOrg",
        defaultConsent: "in"
      });
    </script>
  </body>
</html>
