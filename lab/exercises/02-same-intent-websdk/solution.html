<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Exercise 2 -- solution</title></head>
<body>
  <button id="download">Download brochure</button>
  <script>
    document.getElementById("download").addEventListener("click", () => {
      const url = "https://fake-edge.exercise.invalid/ee/v1/interact?configId=fake-datastream";
      const body = JSON.stringify({
        events: [
          {
            xdm: { eventType: "web.webinteraction.linkClicks" },
            data: {
              __adobe: {
                analytics: {
                  // Same pageName exercise 1's AppMeasurement version sent.
                  pageName: "product-detail",
                  // The event id itself carries what exercise 1 expressed
                  // via pev2 (the link name) -- there's no separate
                  // "link name" field in Web SDK, the event id does that job.
                  events: ["download-brochure"],
                  // Web SDK can also set a numbered eVar directly here
                  // (eVar5: "..."), Adobe's recommended path. This exercise
                  // uses the other common approach: a descriptive key under
                  // contextData, which the datastream config maps to an eVar
                  // server-side -- nothing on the wire says which one.
                  contextData: { "asset.name": "whitepaper-2024" }
                }
              }
            }
          }
        ]
      });
      fetch(url, { method: "POST", body });
    });
  </script>
</body>
</html>
