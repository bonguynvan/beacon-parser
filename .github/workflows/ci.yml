name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bonv/beacon-playwright exec playwright install --with-deps chromium
      # beacon-playwright (and lab's exercise checks) import @bonv/beacon-parser
      # by package name (a real dependency, not a relative path), which
      # resolves through its dist/ output -- must exist before
      # typecheck/test on a fresh checkout.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:lab
