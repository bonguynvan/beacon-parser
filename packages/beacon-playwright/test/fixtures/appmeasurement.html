<!doctype html>
<html>
<head><meta charset="utf-8" /><title>AppMeasurement fixture</title></head>
<body>
  <button id="buy">Buy</button>
  <script>
    // Fires a request shaped like a real AppMeasurement image request.
    // Not the real AppMeasurement.js library -- the capture layer only
    // needs to observe the wire shape, which is identical either way.
    document.getElementById("buy").addEventListener("click", () => {
      const url =
        "https://fake-metrics.invalid/b/ss/examplecompanyprod/1/H29-abc123" +
        "?pageName=checkout&events=event5&v12=checkout&c3=checkout-flow";
      fetch(url, { mode: "no-cors" }).catch(() => {});
    });
  </script>
</body>
</html>
